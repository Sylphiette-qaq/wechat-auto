services:
  # 单容器运行微信、图形服务、AT-SPI 探针和 Go CLI。
  wechat-runtime:
    platform: linux/amd64
    build:
      # 使用项目根目录作为构建上下文，以便读取 artifacts 和源码。
      context: .
      dockerfile: docker/Dockerfile
      args:
        # 构建阶段再次校验微信安装包的固定版本和摘要。
        WECHAT_VERSION: "4.1.1.8"
        WECHAT_SHA256: "c9765e87ee5133bf4bb50d585c1814fafd995e3fb0da62c5ed07259b43dada7b"
    environment:
      # 图形、VNC 和业务识别参数通过环境变量传入容器。
      DISPLAY: ":99"
      SCREEN_SIZE: "1920x1080x24"
      NOVNC_PORT: "6080"
      VNC_PORT: "5900"
      # 群聊读取：机器人昵称（@昵称 提及判定）与会话类型（auto/direct/group）
      WECHAT_ACCOUNT_ID: "${WECHAT_ACCOUNT_ID:-default}"
      # 默认机器人昵称与 Amadeus 系统提示保持一致，也可由宿主机覆盖。
      WECHAT_BOT_NAME: "${WECHAT_BOT_NAME:-小半夏}"
      WECHAT_CHAT_TYPE: "${WECHAT_CHAT_TYPE:-auto}"
      SEND_KEY: "${SEND_KEY:-enter}"
      SEND_TIMEOUT: "${SEND_TIMEOUT:-10s}"
    ports:
      - "127.0.0.1:6080:6080"
      # HTTP 接口仅绑定宿主机回环地址，供本机 Amadeus 使用。
      - "127.0.0.1:8090:8090"
    volumes:
      # 将登录态、配置、日志和诊断快照持久化到 Docker volume。
      - wechat-state:/data/wechat
      - wechat-config:/data/config
      - wechat-logs:/data/logs
      - wechat-diagnostics:/data/diagnostics
    restart: unless-stopped

volumes:
  wechat-state:
  wechat-config:
  wechat-logs:
  wechat-diagnostics:
